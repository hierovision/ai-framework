name: ci

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: npm test
  build:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - run: npm run build
  deploy:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - run: ./deploy.sh
  migrate:
    runs-on: ubuntu-latest
    needs: [deploy]
    steps:
      - run: npx supabase db push
