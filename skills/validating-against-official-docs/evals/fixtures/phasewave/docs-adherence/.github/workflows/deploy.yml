# DO NOT COPY — deliberately defective Azure SWA workflow used as a
# planted-violation fixture for the `validating-against-official-docs` skill.
# It intentionally violates three rules from official-docs.md:
#   - no `pull_request` trigger        -> no preview-per-PR environment
#   - SWA token placed in `vars`       -> secret leak in logs
#   - Vite app without `skip_app_build` -> Oryx misbuilds
# This file is NOT a reference config. See official-docs.md for the doc-backed
# setup, and see AGENTS.md (this fixture) — it is meant to stay broken on disk.
name: azure-swa

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ vars.SWA_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          output_location: "dist"
