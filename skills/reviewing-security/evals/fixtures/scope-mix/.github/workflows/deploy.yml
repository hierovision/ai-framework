name: deploy
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: super-deploy/deploy-action@main
        with:
          token: ${{ secrets.PRODUCTION_TOKEN }}
      - run: echo "deployed ${{ github.event.head_commit.message }}"
