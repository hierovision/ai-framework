<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Phasewave — Dashboard (capture harness)</title>
  <link rel="stylesheet" href="styles.css" />
  <style id="theme-overrides">
    .card .btn { padding: 8px 16px; }
  </style>
</head>
<body>
  <header role="banner" data-testid="app-header">Dashboard</header>
  <main>
    <section class="card" data-testid="order-card" aria-label="Order summary">
      <h2>Order summary</h2>
      <button class="btn" type="button" data-testid="submit-btn"
              style="margin: 12px;">Submit</button>
    </section>
  </main>
</body>
</html>
