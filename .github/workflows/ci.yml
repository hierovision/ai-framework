# CI — quality gates for PRs and merges to main.
#
# Per the library's own skills:
#   - securing-ci: minimal `permissions:`, SHA-pinned third-party actions,
#     no secrets echoed, no long-lived tokens.
#   - designing-cicd: cheap test gate before anything ships (no deploy here).
#
# Gates run fully offline (no `gh`/network): the mandatory skill validator,
# the two issue-script unit suites, and the offline eval verifiers. Skills
# whose verifiers need a live agent/gh are NOT run here (kept hermetic).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least-privilege: read-only is all the gates need.
permissions:
  contents: read

# Cancel a stale run when a newer commit lands on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned (supply-chain safety — see securing-ci skill).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          # Full history so check_typed_evals.py can resolve the base ref it
          # compares new/changed evals against (RM-003 pass 5).
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (node24)
        with:
          node-version: "24"

      - name: Validate all skills (mandatory library rule)
        run: python3 skills/authoring-skills/scripts/validate_skill.py --all

      # RM-003 pass 5 (AC17/AC19): a NEW or CHANGED eval must carry a typed
      # `expect` block. Compare against the PR base (or the pre-push commit).
      - name: Typed-eval enforcement (new/changed evals must carry expect)
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before || 'main' }}"
          if [[ "$BASE" =~ ^0+$ || -z "$BASE" ]]; then BASE="main"; fi
          python3 scripts/check_typed_evals.py --base "$BASE"

      - name: Unit tests — issue scripts
        run: |
          node skills/managing-github-issues/evals/fixtures/unit.test.mjs
          node skills/refining-issue-acceptance/evals/fixtures/unit.test.mjs

      # Offline unit suites — hermetic: no model calls, no secrets, seconds to
      # run. Gated here because these are the gates that catch measurement /
      # reporting drift; a frozen registry count and a migrated-eval assertion
      # both shipped un-gated on 2026-09-28/29 (RM-021).
      - name: Offline unit suites (hermetic, no model calls)
        run: |
          pip install --quiet pyyaml
          python3 skills/observing-runs/scripts/test_query.py
          python3 skills/observing-runs/scripts/test_log.py
          python3 skills/observing-runs/scripts/test_prune.py
          python3 skills/authoring-skills/scripts/test_runner.py
          python3 scripts/test_eval_report.py
          python3 scripts/test_typed_evals.py
          python3 scripts/test_registry.py
          python3 scripts/test_changed_files.py
          python3 scripts/test_quarantine.py
          python3 scripts/test_stall_timeout.py
          python3 scripts/test_eval_workflows.py
          python3 scripts/test_watch_agent.py

      - name: Offline eval verifiers
        run: |
          node skills/managing-github-issues/evals/fixtures/verify.mjs
          node skills/refining-issue-acceptance/evals/fixtures/verify.mjs

      - name: Lint install.sh
        run: bash -n install.sh

      # Enforces .yamllint.yaml (structural rules only — see the config's
      # comments for which stylistic rules are disabled and why).
      - name: Lint workflow YAML
        run: |
          pip install --quiet yamllint
          python3 -m yamllint -c .yamllint.yaml .github/workflows/
