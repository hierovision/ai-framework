# CI — quality gates for PRs and merges to main.
#
# Per the library's own skills:
#   - securing-ci: minimal `permissions:`, SHA-pinned third-party actions,
#     no secrets echoed, no long-lived tokens.
#   - designing-cicd: cheap test gate before anything ships (no deploy here).
#
# Gates run fully offline (no `gh`/network): the mandatory skill validator,
# the two issue-script unit suites, and the offline eval verifiers. Skills
# whose verifiers need a live agent/gh are NOT run here (kept hermetic).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least-privilege: read-only is all the gates need.
permissions:
  contents: read

# Cancel a stale run when a newer commit lands on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned (supply-chain safety — see securing-ci skill).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          # Full history so check_typed_evals.py can resolve the base ref it
          # compares new/changed evals against (RM-003 pass 5).
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (node24)
        with:
          node-version: "24"

      - name: Validate all skills (mandatory library rule)
        run: python3 skills/authoring-skills/scripts/validate_skill.py --all

      # RM-003 pass 5 (AC17/AC19): a NEW or CHANGED eval must carry a typed
      # `expect` block. Compare against the PR base (or the pre-push commit).
      - name: Typed-eval enforcement (new/changed evals must carry expect)
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before || 'main' }}"
          if [[ "$BASE" =~ ^0+$ || -z "$BASE" ]]; then BASE="main"; fi
          python3 scripts/check_typed_evals.py --base "$BASE"

      - name: Unit tests — issue scripts
        run: |
          node skills/managing-github-issues/evals/fixtures/unit.test.mjs
          node skills/refining-issue-acceptance/evals/fixtures/unit.test.mjs

      # Offline unit suites — hermetic: no model calls, no secrets, seconds to
      # run. Gated here because these are the gates that catch measurement /
      # reporting drift; a frozen registry count and a migrated-eval assertion
      # both shipped un-gated on 2026-09-28/29 (RM-021).
      - name: Offline unit suites (hermetic, no model calls)
        run: |
          python3 -m pip install --require-hashes -r scripts/ci-requirements.txt
          python3 skills/observing-runs/scripts/test_query.py
          python3 skills/observing-runs/scripts/test_log.py
          python3 skills/observing-runs/scripts/test_prune.py
          python3 skills/authoring-skills/scripts/test_runner.py
          python3 scripts/test_eval_report.py
          python3 scripts/test_typed_evals.py
          python3 scripts/test_registry.py
          python3 scripts/test_changed_files.py
          python3 scripts/test_quarantine.py
          python3 scripts/test_stall_timeout.py
          python3 scripts/test_eval_workflows.py
          # RM-073 Phase 1 hermetic suites: redaction shapes, eval child-env
          # allowlist, auth-store read root + leaf subagent deny, pinned skill
          # deps (poisoned-CWD axe), the untrusted-content fence, install
          # manifest, roadmap contract.
          python3 scripts/test_log_redaction.py
          python3 scripts/test_eval_env.py
          python3 scripts/test_agent_permissions.py
          python3 scripts/test_skill_deps.py
          node skills/refining-issue-acceptance/evals/fixtures/untrusted-content.test.mjs
          bash scripts/test_install_sh.sh
          python3 scripts/check_roadmap_verbatim.py
          python3 scripts/check_v2_config.py
          python3 scripts/check_v2_config.py --baseline main
          python3 scripts/check_v2_surfaces.py
          python3 scripts/test_v2_config.py
          python3 scripts/test_watch_agent.py
          python3 scripts/test_agent_dispatch.py
          python3 scripts/test_dispatch_agent.py
          python3 scripts/test_validate_delegated_result.py
          python3 scripts/test_delegated_result_contract.py
          python3 scripts/test_session_guard.py
          python3 scripts/test_observe_completion.py
          python3 scripts/test_model_policy.py
          python3 scripts/test_opencode_v2_canary.py
          python3 scripts/test_opencode_v2_consumer.py
          python3 scripts/test_opencode_v2_post_smoke.py
          python3 scripts/test_opencode_upgrade.py
          python3 scripts/test_stage_opencode_config.py
          python3 scripts/opencode_upgrade.py check --pins-only
          python3 scripts/test_scratch_cleanup.py
          python3 scripts/supervision_contract.py --check
          python3 scripts/test_supervision_contract.py
          python3 scripts/test_v2_surface_contract.py
          node --test plugins/auto-compact-at-threshold/test.mjs
          # `model.ts` imports `solid-js` (a runtime peer). The committed
          # package-lock pins the exact peer tree; install it for the test.
          npm ci --prefix plugins/delegation-observer --no-audit --no-fund
          node --test plugins/delegation-observer/state.test.ts plugins/delegation-observer/tui.test.ts plugins/delegation-observer/server.test.ts plugins/delegation-observer/model.test.ts plugins/delegation-sentinel/sentinel.test.ts
          # Break/restore proofs: every liveness guard in the delegation
          # observer must turn its named test red when removed (PR #136 review
          # F8 — the evidence is checked in, not a claim).
          node plugins/delegation-observer/mutation-check.mjs

      - name: Offline eval verifiers
        run: |
          node skills/managing-github-issues/evals/fixtures/verify.mjs
          node skills/refining-issue-acceptance/evals/fixtures/verify.mjs

      - name: Lint install.sh
        run: bash -n install.sh

      # Enforces .yamllint.yaml (structural rules only — see the config's
      # comments for which stylistic rules are disabled and why).
      - name: Lint workflow YAML
        run: |
          python3 -m pip install --require-hashes -r scripts/ci-requirements.txt
          python3 -m yamllint -c .yamllint.yaml .github/workflows/

  # RM-073 P1-6/P1-8: audit every npm surface that has a tracked lockfile.
  # `.opencode` is host-local in this repo (its manifest is gitignored) — the
  # guard skips it here while keeping the surface audited wherever it exists.
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (node24)
        with:
          node-version: "24"
      - name: Audit pinned npm surfaces (production dependency tree)
        run: |
          set -euo pipefail
          audit_surface() {
            local dir="$1"
            if [ ! -f "$dir/package.json" ]; then
              echo "skip $dir (no manifest)"
              return 0
            fi
            if [ ! -f "$dir/package-lock.json" ]; then
              echo "skip $dir (no lockfile — audit needs one)"
              return 0
            fi
            npm ci --prefix "$dir" --omit=dev --no-audit --no-fund
            npm audit --prefix "$dir" --omit=dev
          }
          audit_surface .opencode
          audit_surface plugins/delegation-observer
          audit_surface plugins/delegation-sentinel
          audit_surface skills/capturing-ui-evidence
          audit_surface skills/auditing-accessibility
          audit_surface skills/validating-ui
