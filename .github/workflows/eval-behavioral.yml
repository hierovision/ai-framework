# Behavioral Eval gate — scheduled (GitHub Free, private repo).
#
# Per the library's own skills:
#   - securing-ci: least-privilege `permissions:`, SHA-pinned actions, no secret echo.
#   - designing-cicd: expensive live-agent job on a weekly schedule, separate from
#     the hermetic per-PR gate in ci.yml.
#
# 2026-09-29 — sharded for wall time, on the Go eval lane:
#   - Lane model: `opencode-go/deepseek-v4.1-flash` (user directive 2026-09-29). Chosen
#     over the initial `opencode-go/deepseek-v4.1-flash` and over
#     `mimo-v2.6-flash` on measured evidence: 3/3 canary probes pass, 34 s on a
#     light eval (vs 70 s), 168 s on the heavy one (vs 147 s), AA 37 intel at
#     $0.10/$0.50 per M; mimo measured 2x slower on the same light eval (141 s)
#     which risks the shard timeout. Alt: mimo-v2.6-flash (cheaper, slower).
#   - Depth: weekly = default per skill (26 evals); monthly = full suite (110).
#   - Why shard: a full pass measured 70-300 s per eval (probe 2026-09-29) =
#     ~4-6 h serial, over the 150-min job timeout and the 120-min green-run
#     budget. Six measured-weight shards run in parallel, so the RUN wall time
#     is the slowest shard, not the sum — a full sharded run measured 59 min.
#   - Cost: measured, not estimated — the runner records provider-reported
#     `cost` per eval; the first full sharded run measured ~$1.8
#     (the allowance-equivalent) — see reference/per-change-eval-sla.md.
#   - The report job concatenates the shard run logs (they share the
#     date-stamped filename) and merges quarantine state; shards are disjoint
#     by skill, so stream filenames never collide.
#
# Free-tier adherence (verified against official docs — see plan rm-002):
#   - GitHub Free private repos: 2,000 runner min/month. Sharding spends more
#     minutes per run (6 jobs) but each is short; the weekly schedule + manual
#     dispatch only keeps it inside the budget (see per-change-eval-sla.md).
#   - `permissions: contents: read` — read-only is all the runner needs.
#   - Model access uses a REPOSITORY-level secret (org-level secrets are NOT
#     available to private Free repos). Consumed via ${{ secrets.* }}, never echoed.
#   - Run logs uploaded as artifacts with `retention-days: 30`.
#   - `concurrency` prevents overlapping weekly runs.
#   - Eval lane (user directive 2026-09-29): opencode-go flat-rate,
#     `opencode-go/deepseek-v4.1-flash`, authenticated by OPENCODE_API_KEY.
name: Behavioral Eval (weekly)

on:
  schedule:
    # Mondays 10:30 UTC — DEFAULT DEPTH (one default eval per skill, 26 evals,
    # ~10-15 min). Off-peak for the provider lane.
    - cron: '30 10 * * 1'
    # 1st of the month 10:30 UTC — FULL suite (all 110 included evals), sharded.
    # Depth policy 2026-09-29 (user directive): weekly is the cheap canary pass;
    # the full sweep runs monthly. Measured: full suite ~$1.8 and 59 min wall.
    - cron: '30 10 1 * *'
  workflow_dispatch:
    inputs:
      full:
        description: 'Run the full suite instead of one default eval per skill'
        type: boolean
        default: false
      skills:
        description: 'Space-separated skill names to run (intersected per shard; empty = all)'
        type: string
        default: ''

# Least-privilege: read-only is all the eval runner needs; `actions: read` is
# for the report job's per-artifact log download.
permissions:
  contents: read
  actions: read

# One weekly run at a time; cancel a stale one if re-dispatched.
concurrency:
  group: eval-behavioral-${{ github.ref }}
  cancel-in-progress: true

jobs:
  behavioral-eval:
    runs-on: ubuntu-latest
    # Each shard is ~50-60 min measured-weight; 150 is comfortable headroom.
    timeout-minutes: 150
    name: evals (${{ matrix.shard.name }})
    strategy:
      fail-fast: false   # a red shard must not hide the others' data
      matrix:
        shard:
          - name: implement
            skills: "implementing-features observing-runs managing-github-issues triaging-requirements"
          - name: security
            skills: "reviewing-security sourcing-external-skills authoring-skills"
          - name: ui
            skills: "correcting-ui capturing-ui-evidence validating-ui auditing-accessibility refining-issue-acceptance"
          - name: threat-supply
            skills: "modeling-threats auditing-supply-chain handling-security-incidents releasing-a-version"
          - name: test-trio
            skills: "debugging-test-failures writing-e2e-tests writing-integration-tests writing-unit-tests"
          - name: design-deploy
            skills: "reviewing-code designing-architecture designing-cicd deploying-to-azure-swa deploying-with-supabase securing-ci"
    steps:
      # SHA-pinned (supply-chain safety — see securing-ci skill).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)

      - name: Setup Python
        run: |
          python3 --version
          pip3 install --quiet pyyaml

      # opencode is NOT preinstalled on GitHub-hosted runners; pinned via npm
      # (the curl|bash path failed 403 under runner-IP rate limiting, 2026-09-20).
      - name: Install opencode CLI (pinned via npm)
        env:
          OPENCODE_VERSION: "1.18.18"
        run: npm install --global "opencode-ai@${OPENCODE_VERSION}"

      - name: Add opencode to PATH
        run: echo "$(npm prefix -g)/bin" >> "$GITHUB_PATH"

      # Fresh agents discover skills from the global opencode layout.
      # Trust boundary: install.sh is a repo-LOCAL script from the checked-out
      # branch — the trust mechanism is branch protection on main.
      - name: Install library skills + agents (global layout)
        run: bash install.sh

      - name: Run shard evals (fresh agent per eval)
        env:
          # Repository-level secret ONLY. Consumed by the runner; never echoed.
          # Eval lane (user directive 2026-09-29): opencode-go flat-rate,
          # same model family the suite already ran — no personal API key.
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          BEVAL_MAX_CONTINUATIONS: "2"
        run: |
          # Depth: weekly = one default eval per skill; monthly (or a manual
          # `full` dispatch) = the whole included suite.
          DEFAULT_ARG="--default"
          if [ "${{ github.event.schedule }}" = "30 10 1 * *" ] || [ "${{ inputs.full }}" = "true" ]; then
            DEFAULT_ARG=""
          fi
          # Nested subagents (council lenses etc.) are bound to FREE-tier models
          # locally; in CI the free tier rejects calls outside the OpenCode client
          # ("OpenCode's free tier can only be used from within OpenCode") and the
          # eval session dies. CI-only override to the lane model.
          export OPENCODE_CONFIG_CONTENT="$(python3 scripts/ci-lane-overrides.py --model opencode-go/deepseek-v4.1-flash)"
          # RM-021 AC5: optional targeted dispatch restricts the shard to the
          # intersection of the matrix skill list and the user-supplied list.
          USER_SKILLS="${{ inputs.skills }}"
          SHARD_SKILLS="${{ matrix.shard.skills }}"
          if [ -n "$USER_SKILLS" ]; then
            FILTERED=""
            for s in $SHARD_SKILLS; do
              for u in $USER_SKILLS; do
                if [ "$s" = "$u" ]; then
                  FILTERED="$FILTERED $s"
                  break
                fi
              done
            done
            SHARD_SKILLS="${FILTERED# }"
          fi
          if [ -z "$SHARD_SKILLS" ]; then
            echo "no selected skills in this shard; skipping"
            exit 0
          fi
          SKILL_ARGS=""
          for s in $SHARD_SKILLS; do SKILL_ARGS="$SKILL_ARGS --skill $s"; done
          python3 skills/authoring-skills/scripts/run_behavioral_eval.py \
            --model opencode-go/deepseek-v4.1-flash --logs-dir logs $DEFAULT_ARG $SKILL_ARGS

      - name: Upload shard logs (30-day retention)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (node24)
        with:
          name: eval-logs-shard-${{ matrix.shard.name }}
          path: logs/
          retention-days: 30

  report:
    needs: [behavioral-eval]
    if: always()   # artifacts + reporting must survive a red shard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)

      - name: Download all shard logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Per-artifact download: actions/download-artifact v7 flattens
          # pattern-matched artifacts into `path`, so the same-named
          # run-<date>.jsonl overwrote across shards (2026-10-03: the merge
          # read 0 records). `gh run download -n` guarantees one directory
          # per shard artifact.
          mkdir -p shards
          mapfile -t NAMES < <(gh api \
            "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100" \
            --paginate --jq '.artifacts[].name' | grep '^eval-logs-shard-' | sort)
          if [ "${#NAMES[@]}" -eq 0 ]; then
            echo "no shard log artifacts found" >&2
            exit 1
          fi
          for name in "${NAMES[@]}"; do
            gh run download "${{ github.run_id }}" -n "$name" -D "shards/$name"
          done

      - name: Merge shard logs (run records + quarantine + streams)
        run: |
          set -euo pipefail
          # Each artifact was downloaded to shards/<artifact-name>/ and contains
          # run-*.jsonl and eval-streams/ directly — do NOT look for a nested
          # `logs/` dir.
          SHARD_DIRS=$(find shards -mindepth 1 -maxdepth 1 -type d | tr '\n' ' ')
          if [ -z "$SHARD_DIRS" ]; then
            echo "no shard log directories downloaded" >&2; exit 1
          fi
          python3 scripts/merge-eval-logs.py --out logs $SHARD_DIRS

      - name: Build eval report artifacts
        run: |
          python3 scripts/eval-report.py aggregate --logs-dir logs/ --out eval-report.json || true
          python3 scripts/eval-report.py coverage-gaps --logs-dir logs/ --out coverage-gaps.json || true
          python3 scripts/eval-report.py green-run-status --out green-run-status.json || true
          python3 scripts/eval-report.py quota-projection --out quota-projection.json || true
          python3 scripts/eval-report.py failure-taxonomy --logs-dir logs/ --out failure-taxonomy.json || true

      - name: Upload merged run logs (30-day retention)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (node24)
        with:
          name: observe-run-logs
          path: logs/
          retention-days: 30

      - name: Upload eval report artifacts (30-day retention)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (node24)
        with:
          name: eval-report-${{ github.run_id }}
          path: |
            eval-report.json
            coverage-gaps.json
            green-run-status.json
            quota-projection.json
            failure-taxonomy.json
          retention-days: 30
          if-no-files-found: ignore

      - name: CI summary (report links)
        if: always()
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo "### Eval Report"
            echo "- [eval-report-${{ github.run_id }}]($RUN_URL#artifacts) artifact"
            echo "### Coverage Gaps"
            echo "- [coverage-gaps-${{ github.run_id }}]($RUN_URL#artifacts) artifact"
            echo "### Failure Taxonomy (infra vs content)"
            echo "- [failure-taxonomy-${{ github.run_id }}]($RUN_URL#artifacts) artifact"
            echo "### Steady-State Green Run"
            echo "- [green-run-status-${{ github.run_id }}]($RUN_URL#artifacts) artifact"
            echo "- [definition](reference/eval-green-run-definition.md)"
          } >> "$GITHUB_STEP_SUMMARY"
