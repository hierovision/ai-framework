# Behavioral Eval gate — scheduled (GitHub Free, private repo).
#
# Per the library's own skills:
#   - securing-ci: least-privilege `permissions:`, SHA-pinned actions, no secret echo.
#   - designing-cicd: expensive live-agent job on a weekly schedule, separate from
#     the hermetic per-PR gate in ci.yml.
#
# Free-tier adherence (verified against official docs — see plan rm-002):
#   - GitHub Free private repos: 2,000 runner min/month. A nightly full run of ~63
#     evals would exceed that, so this runs WEEKLY (`0 6 * * 1`) + manual dispatch.
#   - `permissions: contents: read` — read-only is all the runner needs.
#   - Model access uses a REPOSITORY-level secret (org-level secrets are NOT
#     available to private Free repos). Consumed via ${{ secrets.* }}, never echoed.
#   - Run logs uploaded as an artifact with `retention-days: 30` (within GitHub
#     Free's 90-day max; auto-expires — local prune per RM-001).
#   - `concurrency` prevents overlapping weekly runs.
#   - `--limit` / `--skill` subset sharding keeps a full run inside the minute budget.
#   - AI_FRAMEWORK_FREE_TIER=1 forces the free (*-free) tier only — no Go/Zen paid usage.
name: Behavioral Eval (weekly)

on:
  schedule:
    # Weekly Monday 06:06 UTC — NOT nightly (stays within 2,000 min/month).
    - cron: '0 6 * * 1'
  workflow_dispatch:

# Least-privilege: read-only is all the eval runner needs.
permissions:
  contents: read

# One weekly run at a time; cancel a stale one if re-dispatched.
concurrency:
  group: eval-behavioral-${{ github.ref }}
  cancel-in-progress: true

jobs:
  behavioral-eval:
    runs-on: ubuntu-latest
    # Full weekly suite: ~63 evals at the measured ~100s/eval ~= 105 min
    # (see reference/per-change-eval-sla.md). The 120 min ceiling is the AC10
    # green-run budget; the ~105 min duration is expected, not a defect.
    timeout-minutes: 120
    steps:
      # SHA-pinned (supply-chain safety — see securing-ci skill).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)

      - name: Setup Python
        run: |
          python3 --version
          pip3 install --quiet pyyaml

      # opencode is NOT preinstalled on GitHub-hosted runners; the docs install
      # script is the supported path (https://opencode.ai/docs/, retrieved
      # 2026-09-16). Found by the RM-002 AC5 live check: without this step the
      # workflow never ran a single eval (missing binary).
      # 2026-09-20: curl|bash queries the GitHub API internally and failed 403
      # under runner-IP rate limiting — npm registry package instead, pinned
      # to the locally validated version (event-stream shapes vary by CLI
      # version; pinning removes that drift hazard).
      - name: Install opencode CLI (pinned via npm)
        env:
          OPENCODE_VERSION: "1.18.18"
        run: npm install --global "opencode-ai@${OPENCODE_VERSION}"

      - name: Add opencode to PATH
        run: echo "$(npm prefix -g)/bin" >> "$GITHUB_PATH"

      # Fresh agents discover skills from the global opencode layout; without
      # install.sh the CI agent runs bare and produces output outside the
      # repo's conventions (see eval-per-change.yml's matching step, 2026-09-21).
      - name: Install library skills + agents (global layout)
        run: bash install.sh

      - name: Run behavioral evals (fresh agent per eval)
        env:
          # Repository-level secret ONLY (org-level secrets are unavailable on
          # GitHub Free private repos). Consumed by the runner; never echoed.
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          AI_FRAMEWORK_FREE_TIER: 1
        run: |
          # --model is REQUIRED here: opencode's environment default on a fresh
          # runner is `big-pickle` (disabled at the gateway) — found by the
          # RM-002 AC5 live gate, 2026-09-16. The ID is a binding, kept in step
          # with reference/model-routing.md's free generalist (re-verify on
          # each routing pass).
          python3 skills/authoring-skills/scripts/run_behavioral_eval.py --model opencode/nemotron-3-ultra-free

      - name: Build eval report artifacts
        if: always()
        run: |
          python3 scripts/eval-report.py aggregate --logs-dir logs/ --out eval-report.json || true
          python3 scripts/eval-report.py coverage-gaps --logs-dir logs/ --out coverage-gaps.json || true
          python3 scripts/eval-report.py green-run-status --out green-run-status.json || true
          python3 scripts/eval-report.py quota-projection --out quota-projection.json || true

      - name: Upload run logs (30-day retention)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (node24)
        with:
          name: observe-run-logs
          path: logs/
          retention-days: 30

      - name: Upload eval report artifacts (30-day retention)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (node24)
        with:
          name: eval-report-${{ github.run_id }}
          path: |
            eval-report.json
            coverage-gaps.json
            green-run-status.json
            quota-projection.json
          retention-days: 30
          if-no-files-found: ignore

      - name: CI summary (report links)
        if: always()
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo "### Eval Report"
            echo "- [eval-report-${{ github.run_id }}]($RUN_URL#artifacts) artifact"
            echo "### Coverage Gaps"
            echo "- [coverage-gaps-${{ github.run_id }}]($RUN_URL#artifacts) artifact"
            echo "### Steady-State Green Run"
            echo "- [green-run-status-${{ github.run_id }}]($RUN_URL#artifacts) artifact"
            echo "- [definition](reference/eval-green-run-definition.md)"
          } >> "$GITHUB_STEP_SUMMARY"
