# Dependabot configuration (RM-073 P1-8, 2026-11-06).
#
# Scope (plan Open Question 14): every tracked npm surface plus GitHub Actions.
# Weekly, one grouped PR per ecosystem/update type so the queue stays readable.
# `/.opencode` is host-local: its package.json is gitignored, so it is NOT a
# tracked surface and is deliberately not configured here. Configuring it made
# every updater run fail `dependency_file_not_found` (observed 2026-11-07).
version: 2
updates:
  - package-ecosystem: npm
    directory: /plugins/auto-compact-at-threshold
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /plugins/delegation-observer
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # The runtime is Node 24 (all workflows pin node-version: "24"). A types
    # major above the runtime would type-check APIs that may not exist there.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /plugins/delegation-sentinel
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # The runtime is Node 24 (all workflows pin node-version: "24"). A types
    # major above the runtime would type-check APIs that may not exist there.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /skills/capturing-ui-evidence
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /skills/auditing-accessibility
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /skills/validating-ui
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
